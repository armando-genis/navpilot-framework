%YAML:1.0
board_width: 1.2        # width in meters
board_height: 0.6       # height in meters (changed from 0.8)
marker_size: 0.18       # ArUco side length in meters
marker_ids:
    rows: 4
    cols: 1
    dt: i
    data: [1, 2, 3, 4]  # clockwise: top-left, top-right, bottom-right, bottom-left
marker_positions:       # (x,y) of marker TOP-LEFT corners, relative to the board center [m]
    rows: 4
    cols: 2
    dt: f
    data: [
        -0.55,  0.25,   # ID 1 top-left
         0.37,  0.25,   # ID 2 top-right
         0.37, -0.07,   # ID 3 bottom-right
        -0.55, -0.07    # ID 4 bottom-left
    ]
cutouts:                # (id, Xcenter, Ycenter, Radius) in meters, X right, Y up
    rows: 1
    cols: 12
    dt: f
    data: [
        1,  0.15, -0.15, 0.12,   # circle at (center_x + 0.15, center_y + 0.15)
        1, -0.15, -0.15, 0.12,   # circle at (center_x - 0.15, center_y + 0.15)
        1,  0.00,  0.15, 0.12    # circle at (center_x,         center_y - 0.15)
    ]
min_marker_detection: 2
cad_model_mesh:  "calibration_target_3holes_cad_mesh.ply"
cad_model_cloud: "calibration_target_3holes_cad_cloud.ply"
