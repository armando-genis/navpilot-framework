/**:
  ros__parameters:
    # ── Role ──────────────────────────────────────────────────────────
    # false → Jetson-2: CLIENT. Connects to Jetson-1 (the server).
    #          SENDS MarkerArray + Image to Jetson-1.
    #          RECEIVES PointCloud2 + TF from Jetson-1.
    server: false

    # ── Network ───────────────────────────────────────────────────────
    # IP address of Jetson-1 (the server). Change to your actual IP.
    remote_ip: "192.168.1.1"
    port: 5002

    # ── Topic names ───────────────────────────────────────────────────
    # Must match the names configured on Jetson-1.

    # PointCloud2 topic – Jetson-2 will publish what it receives here.
    lidar_topic: "/velodyne_points"

    # TF topic – Jetson-2 will publish what it receives here.
    tf_topic: "/tf"

    # MarkerArray topic – Jetson-2 subscribes to this and sends it across.
    marker_arr_topic: "/marker_array"

    # Image topic – Jetson-2 subscribes to this and sends it across.
    image_topic: "/camera/image_raw"